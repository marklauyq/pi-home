<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pi remote</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login overlay -->
  <div id="login-overlay" class="overlay" hidden>
    <div class="overlay-box">
      <h2>pi remote</h2>
      <input id="token-input" type="text" placeholder="Enter token" autofocus>
      <button id="token-submit">Connect</button>
      <p id="login-error" class="error-text"></p>
    </div>
    <p class="hint">Token is required to connect</p>
  </div>

  <!-- Main app -->
  <div id="app" class="app" hidden>
    <!-- Desktop icon rail -->
    <nav id="rail" class="rail">
      <button id="btn-home" class="rail-btn active" title="Home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
      <button id="btn-settings" class="rail-btn" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </nav>

    <!-- Mobile header (Code title + settings gear) -->
    <div id="mobile-header" class="mobile-header">
      <h1 id="mobile-title" class="mobile-title">Code</h1>
      <button id="btn-settings-mobile" class="btn-settings-mobile" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <!-- Mobile chat header (back + title) -->
    <div id="mobile-chat-header" class="mobile-chat-header">
      <button id="btn-back-mobile" class="btn-back-mobile" title="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <div class="mobile-chat-title">
        <span id="mobile-chat-title-text"></span>
        <span>Remote control</span>
      </div>
      <button id="btn-more-mobile" class="btn-more-mobile" title="More">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      </button>
    </div>

    <!-- Session list pane -->
    <div id="session-list" class="session-list">
      <div id="device-list" class="device-list"></div>
      <div id="history-list" class="history-list"></div>
    </div>

    <!-- Chat pane -->
    <div id="chat-pane" class="chat-pane" hidden>
      <div id="chat-empty" class="chat-empty">
        <p>Select a session to start chatting</p>
      </div>
      <div id="chat-content" class="chat-content" hidden>
        <div id="chat-header" class="chat-header">
          <button id="btn-back" class="btn-back" title="Back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </button>
          <div class="chat-title">
            <span id="chat-title-text"></span>
            <span id="chat-subtitle">Remote control</span>
          </div>
          <button id="btn-more" class="btn-more" title="More">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
          </button>
        </div>
        <div id="offline-banner" class="offline-banner" hidden>Device offline — read only</div>
        <div id="readonly-hint" class="readonly-hint" hidden>Read-only session</div>
        <div id="chat-messages" class="chat-messages"></div>
        <div id="gen-status" class="gen-status" hidden></div>
        <div id="composer" class="composer">
          <input id="composer-input" type="text" placeholder="Message…" autocomplete="off">
          <button id="btn-send" class="btn-send" title="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
          <button id="btn-stop" class="btn-stop" title="Stop" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Settings panel (desktop) -->
    <div id="settings-pane" class="settings-pane" hidden>
      <div class="settings-card">
        <h3>Settings</h3>
        <div class="setting-row">
          <span>Server</span>
          <span id="setting-url"></span>
        </div>
        <div class="setting-row">
          <span>Connection</span>
          <span id="setting-status"></span>
        </div>
        <div class="setting-row">
          <span>Status</span>
          <span id="setting-connected" class="conn-status"></span>
        </div>
      </div>
    </div>

    <!-- Settings sheet (mobile) -->
    <div id="settings-sheet" class="overlay" hidden>
      <div class="overlay-box settings-card">
        <h3>Settings</h3>
        <div class="setting-row">
          <span>Server</span>
          <span id="setting-url-m"></span>
        </div>
        <div class="setting-row">
          <span>Connection</span>
          <span id="setting-status-m"></span>
        </div>
        <div class="setting-row">
          <span>Status</span>
          <span id="setting-connected-m" class="conn-status"></span>
        </div>
        <button id="settings-sheet-close">Close</button>
      </div>
    </div>
  </div>

<script type="module" src="render.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
